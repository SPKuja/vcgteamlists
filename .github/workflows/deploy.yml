name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamhost-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build browser OCR bundle
        run: |
          npm install --no-audit --no-fund
          npm run build:ocr
          test -f assets/vendor/paddleocr/paddleocr.js

      - name: Validate site
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f assets/js/app.js
          test -f assets/js/tcg.js
          test -f assets/js/shared.js
          test -f api/decks.php
          test -f shared/index.html
          node --check assets/js/app.js
          node --check assets/js/auth.js
          node --check assets/js/tcg.js
          node --check assets/js/shared.js
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['assets/js/app.js','assets/js/auth.js','assets/js/tcg.js']) {
            const source = fs.readFileSync(file,'utf8');
            const bad = source.split('\n').filter(line => /(?<!\$)\$\([^)]*\)\.(forEach|map)\(/.test(line));
            if (bad.length) {
              console.error(file+': single-element $() selector used with a collection method');
              console.error(bad.join('\n'));
              process.exit(1);
            }
          }
          NODE
          if compgen -G "api/*.php" > /dev/null; then
            for file in api/*.php; do php -l "$file"; done
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DREAMHOST_HOST: ${{ vars.DREAMHOST_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vcgteamlists_deploy
          chmod 600 ~/.ssh/vcgteamlists_deploy
          ssh-keyscan -H "$DREAMHOST_HOST" >> ~/.ssh/known_hosts

      - name: Prepare private runtime configuration
        env:
          DREAMHOST_HOST: ${{ vars.DREAMHOST_HOST }}
          DREAMHOST_USER: ${{ vars.DREAMHOST_USER }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          ssh -i ~/.ssh/vcgteamlists_deploy "$DREAMHOST_USER@$DREAMHOST_HOST" '
            umask 077
            mkdir -p ~/.config/vcgteamlists ~/.local/share/vcgteamlists/avatars
            chmod 700 ~/.config/vcgteamlists ~/.local/share/vcgteamlists ~/.local/share/vcgteamlists/avatars
            if [ ! -s ~/.config/vcgteamlists/app.key ]; then
              openssl rand -hex 32 > ~/.config/vcgteamlists/app.key
              chmod 600 ~/.config/vcgteamlists/app.key
            fi
          '
          python3 - <<'PY'
          import json, os
          home = f"/home/{os.environ['DREAMHOST_USER']}"
          cfg = {
              "db_host": os.environ["MYSQL_HOST"],
              "db_name": os.environ["MYSQL_DATABASE"],
              "db_user": os.environ["MYSQL_USER"],
              "db_password": os.environ["MYSQL_PASSWORD"],
              "base_url": "https://vcg.pokemonleagueswindon.co.uk",
              "mail_from": "noreply@pokemonleagueswindon.co.uk",
              "data_dir": home + "/.local/share/vcgteamlists",
              "app_key_file": home + "/.config/vcgteamlists/app.key",
          }
          payload = json.dumps(cfg, ensure_ascii=False)
          with open("/tmp/vcg-config.php", "w", encoding="utf-8") as f:
              f.write("<?php\nreturn json_decode(<<<'JSON'\n")
              f.write(payload)
              f.write("\nJSON, true, 512, JSON_THROW_ON_ERROR);\n")
          PY
          scp -i ~/.ssh/vcgteamlists_deploy /tmp/vcg-config.php "$DREAMHOST_USER@$DREAMHOST_HOST:.config/vcgteamlists/config.php"
          ssh -i ~/.ssh/vcgteamlists_deploy "$DREAMHOST_USER@$DREAMHOST_HOST" 'chmod 600 ~/.config/vcgteamlists/config.php'
          rm -f /tmp/vcg-config.php

      - name: Deploy site
        env:
          DREAMHOST_HOST: ${{ vars.DREAMHOST_HOST }}
          DREAMHOST_USER: ${{ vars.DREAMHOST_USER }}
          DREAMHOST_PATH: ${{ vars.DREAMHOST_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='vite.ocr.config.mjs' \
            --exclude='README.md' \
            --exclude='.well-known/' \
            --exclude='images/' \
            -e "ssh -i ~/.ssh/vcgteamlists_deploy" \
            ./ "$DREAMHOST_USER@$DREAMHOST_HOST:$DREAMHOST_PATH/"

      - name: Run database migrations
        env:
          DREAMHOST_HOST: ${{ vars.DREAMHOST_HOST }}
          DREAMHOST_USER: ${{ vars.DREAMHOST_USER }}
          DREAMHOST_PATH: ${{ vars.DREAMHOST_PATH }}
        run: |
          ssh -i ~/.ssh/vcgteamlists_deploy "$DREAMHOST_USER@$DREAMHOST_HOST" "php '$DREAMHOST_PATH/api/migrate.php'"
